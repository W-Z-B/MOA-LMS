[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"**/tests.py" = ["S105", "S106"]  # test fixtures use literal passwords
"**/tests/*.py" = ["S105", "S106"]
"**/test_*.py" = ["S105", "S106"]
"conftest.py" = ["S105", "S106"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]
addopts = "-p no:cacheprovider"

# Coverage of application code (tests, migrations and entry points left out). `pytest --cov` fails below
# fail_under. 90 is the level measured on 5 October 2026 (90.12%, with the security, privacy, quizzes and
# practicals work merged), rounded down; it started at 82 and has passed the gold standard's floor of 88
# (docs/adr/0009-quality-tooling.md). Raise it as tests are added, never lower it without a reason in the
# pull request.
[tool.coverage.run]
source = ["."]
branch = true
omit = [
    "*/migrations/*",
    "*/tests.py",
    "*/test_*.py",
    "conftest.py",
    "manage.py",
    "config/wsgi.py",
    "config/asgi.py",
]

[tool.coverage.report]
fail_under = 90
skip_covered = true
show_missing = true
