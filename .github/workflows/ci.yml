# Quality gates for every pull request and every push to main. Each job is part of the definition of done
# (CONTRIBUTING.md); a red job blocks the merge. Runs on GitHub Actions and, unchanged, on Forgejo or
# Gitea Actions. Actions are pinned to a commit so that a moved tag cannot change what runs.
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"] # a release: the sbom job attaches its files to it
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (lint, checks, docs, tests, licences, vulnerabilities)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lms
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: ci_only_not_a_secret
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U lms" --health-interval 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret-but-long-enough-for-the-deploy-check-0123456789
      FIELD_ENCRYPTION_KEY: ci-only-not-a-secret
      DB_HOST: localhost
      DB_NAME: lms
      DB_USER: lms
      DB_PASSWORD: ci_only_not_a_secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - name: The libraries the PDF engine needs, as in the API image
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - name: Install the locked packages
        run: pip install --require-hashes -r api/requirements.txt -r api/requirements-dev.txt
      - name: Lint and formatting
        run: |
          ruff check api
          ruff format --check api
          ruff check --config api/pyproject.toml scripts loadtest
          ruff format --check --config api/pyproject.toml scripts loadtest
      - name: Django checks, including the production security settings
        working-directory: api
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          DJANGO_DEBUG=0 DJANGO_ALLOWED_HOSTS=lms.example python manage.py check --deploy --fail-level WARNING
      - name: API documentation describes every endpoint
        run: python api/manage.py spectacular --validate --fail-on-warn --file /dev/null
      - name: Tests and coverage (threshold in api/pyproject.toml)
        working-directory: api
        run: pytest -q --cov --cov-report=term
      - name: Licence policy for shipped packages (ADR 0002), after testing the gate itself
        run: |
          python -m pytest -q -p no:django -p no:cacheprovider --rootdir scripts scripts
          python scripts/check_licences.py
      - name: Known vulnerabilities in the locked packages
        run: pip-audit --require-hashes --disable-pip --progress-spinner off -r api/requirements.txt -r api/requirements-dev.txt

  web:
    name: web (lint, types, tests, build, page weight, licences, vulnerabilities)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Component and logic tests with coverage (thresholds in vite.config.ts)
        run: npm run test:coverage
      - name: Type-check (app, config and e2e code) and production build
        run: npm run build
      - name: Page-weight budget for the application shell
        run: npm run check:bundle
      - name: Licence policy for shipped packages (ADR 0002), after testing the gate itself
        run: |
          node --test "../scripts/*.test.mjs"
          node ../scripts/check_npm_licences.mjs
      - name: Known vulnerabilities (high in what ships, critical in the tools)
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical

  e2e:
    name: e2e (journeys and accessibility, desktop and phone)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Hosted image, fresh database, fictional data, Playwright
        run: bash scripts/e2e.sh
        env:
          CI: "true"
      - name: Keep the report when a journey fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 14

  secrets:
    name: secrets (gitleaks over the whole history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan every commit (allowlist in .gitleaks.toml)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner

  compose:
    name: compose (production configuration and images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cp .env.example .env && sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=ci_only/' .env
      - run: docker compose -f compose.yml -f deploy/compose.prod.yml config --quiet
      - run: docker compose -f compose.e2e.yml config --quiet
      - name: Build every production image, the web bundle included (item 7.13)
        run: |
          docker build --build-arg INSTALL_DEV=0 -t gsa-lms-api:ci ./api
          docker build -f deploy/railway/Dockerfile -t gsa-lms-hosted:ci .
          docker compose -f compose.yml -f deploy/compose.prod.yml build web
      - name: Production images carry no development or test tools
        run: |
          for image in gsa-lms-api:ci gsa-lms-hosted:ci; do
            docker run --rm "$image" python -c "import importlib.util as u, sys; sys.exit(any(u.find_spec(m) for m in ('pytest', 'ruff', 'pip_audit')))"
          done
          # The web image holds the built files only: no Node, npm or source.
          docker run --rm gsa-lms-web sh -c '! command -v node && ! command -v npm && test -f /dist/index.html && test ! -e /dist/src'

  sbom:
    name: sbom (software bills of materials and third-party notices, item 7.20)
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used on a release tag, to attach the files to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Python - what ships (api/requirements.txt alone, in an environment of its own)
        run: |
          python -m venv /tmp/shipped
          /tmp/shipped/bin/pip install --require-hashes --no-deps -r api/requirements.txt
          python -m venv /tmp/sbom-tool
          /tmp/sbom-tool/bin/pip install --require-hashes -r api/requirements-sbom.txt
          /tmp/sbom-tool/bin/cyclonedx-py environment --of JSON \
            --output-reproducible -o sbom-python.cdx.json /tmp/shipped/bin/python
      - name: Web - production dependencies only
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-reproducible \
            --output-format JSON --output-file ../sbom-web.cdx.json
      - name: Third-party notices, naming where each LGPL or MPL source is obtained
        run: python scripts/third_party_notices.py sbom-python.cdx.json sbom-web.cdx.json -o THIRD-PARTY-NOTICES.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-and-notices
          path: |
            sbom-python.cdx.json
            sbom-web.cdx.json
            THIRD-PARTY-NOTICES.md
          retention-days: 90
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes "Release $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" sbom-python.cdx.json sbom-web.cdx.json THIRD-PARTY-NOTICES.md --clobber
