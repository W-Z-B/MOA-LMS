# Production overrides. Usage:
#   docker compose -f compose.yml -f deploy/compose.prod.yml up -d
services:
  api:
    build:
      context: ./api
      args:
        INSTALL_DEV: "0" # runtime packages only
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 60
    volumes:
      - files:/srv/files
    restart: unless-stopped

  worker:
    volumes:
      - files:/srv/files
    restart: unless-stopped

  web:
    # Static bundle built by web/Dockerfile and copied into the volume Caddy serves; the dev server and
    # Node are not used in production.
    build:
      context: ./web
    image: gsa-lms-web
    working_dir: /
    command: ["publish-web"]
    # Only the volume: the development stack mounts the source and node_modules here, which the built
    # image does not need.
    volumes: !override
      - web_dist:/srv/web
    restart: "no"

  caddy:
    # Starts once the bundle is in place, so the first request never meets an empty volume.
    depends_on:
      web:
        condition: service_completed_successfully
    volumes:
      - ./deploy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - web_dist:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  db:
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
      - backups:/backups

volumes:
  web_dist:
  backups:
