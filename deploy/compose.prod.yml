# Production overrides. Usage:
#   docker compose -f compose.yml -f deploy/compose.prod.yml up -d
services:
  api:
    build:
      context: ./api
      args:
        INSTALL_DEV: "0" # runtime packages only
    # Worker processes and threads in each (item 7.08, docs/performance.md): threads overlap the waits on the
    # database; processes use the cores. About two processes a core suits the host.
    command: >-
      gunicorn -c config/gunicorn.py config.wsgi:application --bind 0.0.0.0:8000 --timeout 60
      --workers ${WEB_CONCURRENCY:-4} --threads ${GUNICORN_THREADS:-4}
    environment:
      # Each gunicorn worker counts its requests here; /api/metrics adds them up (item 7.10).
      PROMETHEUS_MULTIPROC_DIR: /tmp/lms-metrics
    volumes:
      - files:/srv/files
    restart: unless-stopped

  worker:
    volumes:
      - files:/srv/files
    restart: unless-stopped

  web:
    # Static bundle built by web/Dockerfile and copied into the volume Caddy serves; the dev server and
    # Node are not used in production.
    build:
      context: ./web
    image: gsa-lms-web
    working_dir: /
    command: ["publish-web"]
    # Only the volume: the development stack mounts the source and node_modules here, which the built
    # image does not need.
    volumes: !override
      - web_dist:/srv/web
    restart: "no"

  caddy:
    # Starts once the bundle is in place, so the first request never meets an empty volume.
    depends_on:
      web:
        condition: service_completed_successfully
    volumes:
      - ./deploy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - web_dist:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  db:
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
      - backups:/backups

volumes:
  web_dist:
  backups:
