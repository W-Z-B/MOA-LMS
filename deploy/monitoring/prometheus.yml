# Prometheus (Apache 2.0) for the GSA LMS (item 7.10). An example to adapt, used by compose.monitoring.yml.
# It scrapes the API on the private network, never through Caddy (Caddy answers /api/metrics with 404), with
# the token in METRICS_TOKEN kept in a file beside this one (metrics_token, mode 600, never committed).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: lms-api
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["api:8000"]
  # The backup's own result, written by scripts/backup.sh as a text file for node_exporter (Apache 2.0) on
  # the host: lms_backup_last_success_timestamp_seconds. Remove this job where node_exporter is not used.
  - job_name: lms-host
    static_configs:
      - targets: ["host.docker.internal:9100"]
